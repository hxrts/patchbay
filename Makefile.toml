[config]
default_to_workspace = false

[tasks.run-vm]
script = ['''
  set -euo pipefail
  TARGET_BASE="$(cargo metadata --format-version 1 --no-deps | jq -r '.target_directory')"
  MUSL_TARGET="x86_64-unknown-linux-musl"
  cargo build --release --target "${MUSL_TARGET}" -p patchbay-runner --bin patchbay --example transfer
  cargo run -p patchbay-vm -- run --patchbay-version "path:${TARGET_BASE}/${MUSL_TARGET}/release/patchbay" ${@}
  ''']

[tasks.test-vm]
script = ['''
  set -euo pipefail
  cargo run -p patchbay-vm -- test --target "x86_64-unknown-linux-musl" ${@}
  ''']

[tasks.format]
workspace = false
command = "cargo"
args = [
     "fmt",
     "--all",
     "--",
     "--config",
     "unstable_features=true",
     "--config",
     "imports_granularity=Crate,group_imports=StdExternalCrate,reorder_imports=true,format_code_in_doc_comments=true",
]

[tasks.format-check]
workspace = false
command = "cargo"
args = [
     "fmt",
     "--all",
     "--check",
     "--",
     "--config",
     "unstable_features=true",
     "--config",
     "imports_granularity=Crate,group_imports=StdExternalCrate,reorder_imports=true,format_code_in_doc_comments=true",
]

[tasks.test-canary-holepunch]
workspace = false
script = ['''
  set -euo pipefail
  cargo test -p patchbay fullcone_holepunch
  cargo test -p patchbay home_nat_holepunch
''']

[tasks.test-canary-nat-rebind]
workspace = false
script = ['''
  set -euo pipefail
  cargo test -p patchbay mode_port_change
  cargo test -p patchbay mode_ip_change
  cargo test -p patchbay conntrack_flush
''']

[tasks.test-canary-firewall]
workspace = false
script = ['''
  set -euo pipefail
  cargo test -p patchbay corporate_blocks_udp
  cargo test -p patchbay captive_portal_blocks_udp
  cargo test -p patchbay custom_selective
''']

[tasks.test-canary]
workspace = false
dependencies = [
  "test-canary-holepunch",
  "test-canary-nat-rebind",
  "test-canary-firewall",
]
